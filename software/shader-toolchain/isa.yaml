# APU shader ISA specification
#Source to copy the real layout from:
#   hardware/src/apu/apu_opcode_pkg.vhd        (opcode values)
#   hardware/src/apu/audio_control_unit.vhd    (EXECUTE case: instr bit -> field decode)
#
# IMPORTANT -- every param field below is an OFFSET, not an immediate value.
# There are no literal/immediate param fields in this ISA -- that includes
# scalar_parameter, despite the name suggesting otherwise.
#
# A param field is an index into the shared CPU<->APU BRAM's param table
# (see software/apu/include/apu.h: apu_t.param_mem_left / param_mem_right,
# each 512 words -- matching the 9-bit width most of these fields have). The
# CPU writes the real value (a buffer address, a length, a scalar gain, ...)
# into param_mem_left[offset] / param_mem_right[offset] via apu_load_param()
# *before* the shader runs; the instruction only says which offset to read.
#
# This is also why param memory is split left/right: the same instruction
# stream runs twice (once per channel, via AudioCU's lr toggle), and the
# same field value (e.g. buffer_start_reg=5) resolves against
# param_mem_left[5] while running for the left channel and
# param_mem_right[5] for the right -- one program, two different real
# values, because the CPU staged different values at the same offset in
# each half of the table.
#
# Not a param, and not an offset: FFT's forward_inverse/size_256_512 (1 bit
# each) select which variant of the operation runs -- they're literal mode
# bits the CU branches on directly, not a reference to param memory.

instruction_bits: 128
word_bits: 32
word_order: msb_first

opcode_field: {msb: 127, lsb: 124}   #equal width and position for all opcodes

opcodes:

  #Stop opcode, end the shader program.
  STOP:
    value: 0xF
    fields: []

  NOP:
    value: 0x0
    fields: []

  AUDIO_IN:
    value: 0xC
    fields: &audio_io_fields
      - {name: buffer_start_reg,  msb: 35, lsb: 27}
      - {name: buffer_length_reg, msb: 26, lsb: 18}
      - {name: operation_start_reg, msb: 17, lsb: 9}
      - {name: operation_length_reg, msb: 8, lsb: 0}

  AUDIO_OUT:
    value: 0xD
    fields: *audio_io_fields

  LOAD:
    value: 0xB
    fields:
      - {name: instr_ram_start_addr, msb: 45, lsb: 36}
      - {name: buffer_start_reg, msb: 35, lsb: 27}
      - {name: buffer_length_reg, msb: 26, lsb: 18}
      - {name: operation_start_reg, msb: 17, lsb: 9}
      - {name: operation_length_reg, msb: 8, lsb: 0}

  ADD_VEC:
    value: 0x3
    fields:
      - {name: output_buffer_start_reg, msb: 89, lsb: 81}
      - {name: output_buffer_length_reg, msb: 80, lsb: 72}
      - {name: output_operation_start_reg, msb: 71, lsb: 63}
      - {name: input_buffer_2_start_reg, msb: 62, lsb: 54}
      - {name: input_buffer_2_length_reg, msb: 53, lsb: 45}
      - {name: input_operation_2_start_reg, msb: 44, lsb: 36}
      - {name: input_buffer_1_start_reg, msb: 35, lsb: 27}
      - {name: input_buffer_1_length_reg, msb: 26, lsb: 18}
      - {name: input_operation_1_start_reg, msb: 17, lsb: 9}
      - {name: operation_length_reg, msb: 8, lsb: 0}

  ADD_SCALAR:
    value: 0x4
    fields:
      - {name: output_buffer_start_reg, msb: 89, lsb: 81}
      - {name: output_buffer_length_reg, msb: 80, lsb: 72}
      - {name: output_operation_start_reg, msb: 71, lsb: 63}
      # bits 62:52 unused
      - {name: scalar_parameter, msb: 51, lsb: 36}
      - {name: input_buffer_1_start_reg, msb: 35, lsb: 27}
      - {name: input_buffer_1_length_reg, msb: 26, lsb: 18}
      - {name: input_operation_1_start_reg, msb: 17, lsb: 9}
      - {name: operation_length_reg, msb: 8, lsb: 0}

  FFT:
    value: 0x1
    fields:
      - {name: forward_inverse, msb: 123, lsb: 123}
      - {name: size_256_512, msb: 122, lsb: 122}
      # bits 121:90 unused
      - {name: output_buffer_start_reg, msb: 89, lsb: 81}
      - {name: output_buffer_length_reg, msb: 80, lsb: 72}
      - {name: output_operation_start_reg, msb: 71, lsb: 63}
      # bits 62:36 unused
      - {name: input_buffer_1_start_reg, msb: 35, lsb: 27}
      - {name: input_buffer_1_length_reg, msb: 26, lsb: 18}
      - {name: input_operation_1_start_reg, msb: 17, lsb: 9}
      - {name: operation_length_reg, msb: 8, lsb: 0}

  # To add in future
  IFFT:
    value: 0x2
    implemented: false
    fields: []

  SUB_VECTOR:
    value: 0x5
    implemented: false
    fields: []

  SUB_SCALAR:
    value: 0x6
    implemented: false
    fields: []

  MUL_VECTOR:
    value: 0x7
    implemented: false
    fields: []

  MUL_SCALAR:
    value: 0x8
    implemented: false
    fields: []

  PITCH_SHIFT:
    value: 0x9
    implemented: false
    fields: []

  FOND_FREQ:
    value: 0xA
    implemented: false
    fields: []

  MULC_VECTOR:
    value: 0xE
    implemented: false
    fields: []
